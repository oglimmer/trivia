services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trivia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trivia}
      POSTGRES_DB: ${POSTGRES_DB:-trivia}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trivia}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trivia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trivia}
      POSTGRES_DB: ${POSTGRES_DB:-trivia}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-letmein}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32-bytes}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@oglimmer.com}
      SMTP_REPLY_EMAIL: ${SMTP_REPLY_EMAIL:-noreply@oglimmer.com}
      SMTP_REPLY_NAME: ${SMTP_REPLY_NAME:-Trivia-Helper}
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE: /api
      VITE_WS_BASE: /ws
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  db-data:
