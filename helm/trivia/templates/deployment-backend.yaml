apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trivia.backend.fullname" . }}
  labels:
    {{- include "trivia.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "trivia.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "trivia.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "trivia.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Values.backend.name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        {{- if .Values.postgres.enabled }}
        - name: POSTGRES_USER
          value: {{ .Values.postgres.user | quote }}
        - name: POSTGRES_DB
          value: {{ .Values.postgres.database | quote }}
        - name: POSTGRES_HOST
          value: {{ include "trivia.postgres.fullname" . | quote }}
        - name: POSTGRES_PORT
          value: {{ .Values.postgres.service.port | quote }}
        {{- else }}
        - name: POSTGRES_USER
          value: {{ .Values.externalPostgres.user | quote }}
        - name: POSTGRES_DB
          value: {{ .Values.externalPostgres.database | quote }}
        - name: POSTGRES_HOST
          value: {{ .Values.externalPostgres.host | quote }}
        - name: POSTGRES_PORT
          value: {{ .Values.externalPostgres.port | quote }}
        {{- end }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "trivia.secretName" . }}
              key: POSTGRES_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "trivia.secretName" . }}
              key: JWT_SECRET
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "trivia.secretName" . }}
              key: ADMIN_PASSWORD
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "trivia.secretName" . }}
              key: ANTHROPIC_API_KEY
              optional: true
        {{- with .Values.anthropic.model }}
        - name: ANTHROPIC_MODEL
          value: {{ . | quote }}
        {{- end }}
        - name: PUBLIC_BASE_URL
          value: {{ .Values.publicBaseURL | quote }}
        - name: SMTP_ENABLED
          value: {{ .Values.smtp.enabled | quote }}
        - name: SMTP_HOST
          value: {{ .Values.smtp.host | quote }}
        - name: SMTP_PORT
          value: {{ .Values.smtp.port | quote }}
        - name: SMTP_TLS
          value: {{ .Values.smtp.tls | quote }}
        - name: SMTP_STARTTLS
          value: {{ .Values.smtp.starttls | quote }}
        - name: SMTP_FROM
          value: {{ .Values.smtp.from | quote }}
        - name: SMTP_REPLY_EMAIL
          value: {{ .Values.smtp.replyEmail | quote }}
        - name: SMTP_REPLY_NAME
          value: {{ .Values.smtp.replyName | quote }}
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "trivia.secretName" . }}
              key: SMTP_USER
              optional: true
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "trivia.secretName" . }}
              key: SMTP_PASSWORD
              optional: true
        - name: METRICS_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "trivia.secretName" . }}
              key: METRICS_TOKEN
              optional: true
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
