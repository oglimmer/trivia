# Default values for trivia

replicaCount: 1

# Public URL (HTTPS — websockets are upgraded over the same origin via /ws).
publicBaseURL: "https://trivia.oglimmer.com"

# Anthropic / Claude API integration. The API key itself goes into the sealed
# secret under the ANTHROPIC_API_KEY key; only the model id is set here.
anthropic:
  model: "claude-sonnet-4-6"

# Outbound SMTP for the player magic-link emails. Disabled by default — when
# off, the backend logs the login URL instead so dev/test flows still work.
# User/Password live in the sealed secret under SMTP_USER / SMTP_PASSWORD if
# the relay needs auth; leave the keys empty otherwise. tls and starttls are
# mutually exclusive — pick the one the relay expects.
#   tls=true       → implicit TLS (SMTPS, typically port 465)
#   starttls=true  → required STARTTLS upgrade (typically port 587)
#   both false     → plain SMTP, NO TLS attempted (use only for anonymous
#                    relays on a trusted network; Go's PlainAuth refuses to
#                    send credentials over plaintext, so auth won't work)
smtp:
  enabled: true
  host: "smtp.fastmail.com"
  port: 465
  tls: true
  starttls: false
  from: "noreply@oglimmer.com"
  replyEmail: "noreply@oglimmer.com"
  replyName: "Trivia-Helper"

# Backend (API + WebSocket) configuration
backend:
  name: api
  image:
    repository: ghcr.io/oglimmer/trivia-backend
    pullPolicy: Always
    tag: "latest"

  service:
    type: ClusterIP
    port: 8080

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Frontend (nginx serving the SPA) configuration
frontend:
  name: web
  image:
    repository: ghcr.io/oglimmer/trivia-frontend
    pullPolicy: Always
    tag: "latest"

  service:
    type: ClusterIP
    port: 80

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Bundled Postgres (single-replica, PVC-backed). Set enabled=false to use an
# external database — then provide host/user/db here and put the password in
# the sealed secret under POSTGRES_PASSWORD.
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  user: trivia
  database: trivia
  service:
    port: 5432
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# External Postgres (only consulted when postgres.enabled=false).
# Password is read from the sealed secret's POSTGRES_PASSWORD key.
externalPostgres:
  host: ""
  port: 5432
  user: trivia
  database: trivia

# Ingress configuration. Traefik 3 + cert-manager, matching the
# oglimmer.com DNS-01 cluster issuer. Path order matters — backend paths
# (/api, /ws, /health, /metrics) MUST come BEFORE the frontend catch-all "/".
#
# Traefik handles WebSocket upgrades and disables response buffering on its
# own — no per-Ingress annotation needed for /ws. If the AI-suggest payload
# needs a bigger body cap than the Traefik entrypoint default, raise it on the
# Traefik install itself (transport.respondingTimeouts, maxBodySize).
ingress:
  enabled: true
  # Set to "traefik" if Traefik isn't the cluster's default IngressClass.
  className: ""
  annotations:
    cert-manager.io/cluster-issuer: "oglimmer-com-dns"
  hosts:
    - host: trivia.oglimmer.com
      paths:
        - path: /api
          pathType: Prefix
          backend: api
        - path: /ws
          pathType: Prefix
          backend: api
        - path: /health
          pathType: Exact
          backend: api
        - path: /metrics
          pathType: Exact
          backend: api
        - path: /
          pathType: Prefix
          backend: web
  tls:
    - secretName: tls-trivia-ingress-dns
      hosts:
        - trivia.oglimmer.com

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod annotations
podAnnotations: {}

# Pod-level security context.
podSecurityContext: {}

# Backend container security context. The Go binary runs as a non-root user.
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Frontend (nginx) security context.
frontendSecurityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

nodeSelector: {}
tolerations: []
affinity: {}

# Image pull secrets. ghcr.io/oglimmer/trivia-{backend,frontend} are public,
# so no pull secret is needed by default. If the GHCR namespace becomes
# private, create a docker-registry secret and reference it here — see
# helm/trivia/README.md.
imagePullSecrets: []
